services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lidimus
      POSTGRES_PASSWORD: lidimus
      POSTGRES_DB: lidimus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lidimus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      NUXT_DATABASE_URL: ${DATABASE_URL}
      NUXT_REDIS_URL: ${REDIS_URL}
      NUXT_BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NUXT_N8N_CALLBACK_SECRET: ${N8N_CALLBACK_SECRET}
      NUXT_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      NUXT_STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NUXT_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NUXT_RESEND_API_KEY: ${RESEND_API_KEY:-}
      NUXT_EMAIL_FROM: ${EMAIL_FROM:-}
      NUXT_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NUXT_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CLOUD_SA_KEY_JSON: ${GOOGLE_CLOUD_SA_KEY_JSON}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-lidimus-job-files}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: packages/workers/Dockerfile
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "node", "packages/workers/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  pgdata:
  redisdata:

