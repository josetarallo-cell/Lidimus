services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data

  # Pool de conexões na frente do Postgres — cada réplica de web/worker abre seu
  # próprio pool (10 conexões); sem isso, escalar réplicas esgota max_connections.
  # Ao usar, aponte DATABASE_URL para pgbouncer:5432 e defina DB_DISABLE_PREPARE=true.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
    depends_on:
      - postgres

  web:
    image: lidimus-web:latest
    restart: always
    ports:
      - "3000:3000"
    env_file: .env.prod
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - redis

  worker:
    image: lidimus-worker:latest
    restart: always
    # BullMQ suporta múltiplos consumidores na mesma fila sem duplicar jobs —
    # escalar é só aumentar WORKER_REPLICAS (introduzir PgBouncer antes de passar de ~3)
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    env_file: .env.prod
    healthcheck:
      test: ["CMD", "node", "packages/workers/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
